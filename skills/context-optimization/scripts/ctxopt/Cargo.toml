[package]
name = "ctxopt"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Context-optimization audit tool — file scanning, token counting, dedup detection, TOON/JSONL output."
license = "MIT"

[[bin]]
name = "ctxopt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.5"
sha2 = "0.10"
walkdir = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
